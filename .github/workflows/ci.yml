name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Kern und Inhalte (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests und Inhaltsprüfung
        run: ./gradlew check --console=plain
      - name: UI-Prototyp-Screenshots (headless)
        if: runner.os == 'Linux'
        run: ./gradlew :ui-prototype:screenshots --console=plain
      - name: Screenshots sichern
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ui-prototype-screenshots
          path: tools/ui-prototype/build/screenshots/
      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            core/build/reports/tests/
            ui/build/reports/tests/

  mod:
    name: Fabric-Mod (Minecraft 26.3)
    runs-on: ubuntu-latest
    env:
      MINECRAFT_VERSION: "26.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fabric-Versionen ermitteln
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          MC="$MINECRAFT_VERSION"
          GAME=$(curl -fsS https://meta.fabricmc.net/v2/versions/game | jq -r --arg v "$MC" '[.[] | select(.version==$v)][0] | "\(.version) stable=\(.stable)"')
          LOADER=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          API=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
                | grep -oE "<version>[^<]*\+${MC}</version>" | sed -E 's#</?version>##g' | tail -1 || true)
          LOOM=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml \
                | grep -oE '<version>[0-9]+\.[0-9]+(\.[0-9]+)?</version>' | sed -E 's#</?version>##g' | sort -V | tail -1 || true)
          echo "Minecraft: $GAME | Loader: $LOADER | Fabric API: $API | Loom: $LOOM"
          echo "::notice title=Fabric-Versionen::minecraft=$MC loader=$LOADER fabric_api=$API loom=$LOOM ($GAME)"
          test -n "$LOADER" && test -n "$API" && test -n "$LOOM"
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "loom=$LOOM" >> "$GITHUB_OUTPUT"
          {
            echo "### Fabric-Versionen"
            echo "| Komponente | Version |"
            echo "|---|---|"
            echo "| Minecraft | $GAME |"
            echo "| Fabric Loader | $LOADER |"
            echo "| Fabric API | $API |"
            echo "| Loom | $LOOM |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mod bauen
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :mod:build --console=plain \
            -Pfabric.minecraftVersion="$MINECRAFT_VERSION" \
            -Pfabric.loaderVersion="${{ steps.versions.outputs.loader }}" \
            -Pfabric.apiVersion="${{ steps.versions.outputs.api }}" \
            -Pfabric.loomVersion="${{ steps.versions.outputs.loom }}" 2>&1 | tee mod-build.log
      - name: Fehler als Annotationen melden
        if: failure()
        shell: bash
        run: |
          grep -E "error:|What went wrong|Could not|> " mod-build.log | head -40 | while IFS= read -r line; do
            echo "::error title=Mod-Build::${line}"
          done
      - name: Jar-Inhalt prüfen
        shell: bash
        run: |
          JAR=$(ls mod/build/libs/frosthain-*.jar | grep -v sources | head -1)
          unzip -l "$JAR" | grep -E "fabric.mod.json|META-INF/jars/|frosthain/frosthain/classes/fighter.json|Cinzel.ttf"
          echo "::notice title=Mod-Jar::$(basename "$JAR") $(stat -c %s "$JAR") Bytes"
      - name: Mod-Jar sichern
        uses: actions/upload-artifact@v4
        with:
          name: frosthain-mod
          path: mod/build/libs/
