name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Kern und Inhalte (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests und Inhaltsprüfung
        run: ./gradlew check --console=plain
      - name: UI-Prototyp-Screenshots (headless)
        if: runner.os == 'Linux'
        run: ./gradlew :ui-prototype:screenshots --console=plain
      - name: Screenshots sichern
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ui-prototype-screenshots
          path: tools/ui-prototype/build/screenshots/
      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            core/build/reports/tests/
            ui/build/reports/tests/
