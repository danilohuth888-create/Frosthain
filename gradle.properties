frosthain.version=0.1.0-SNAPSHOT

org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Toolchains werden nicht automatisch heruntergeladen: der Build soll reproduzierbar
# mit einem lokal installierten JDK 25 laufen (Windows: Temurin 25 / Microsoft Build of OpenJDK 25).
org.gradle.java.installations.auto-download=false

# Fabric-Toolchain für die Mod (ermittelt und erfolgreich gebaut im CI am 01.11.2026,
# Quelle: meta.fabricmc.net und maven.fabricmc.net). Minecraft 26.3 ist dort als stabil geführt.
fabric.minecraftVersion=26.3
fabric.loaderVersion=0.20.1
fabric.apiVersion=0.165.0+26.3
fabric.loomVersion=1.19.3
